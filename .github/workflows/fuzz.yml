name: Fuzz

# Nightly fuzzing of every decoder that reads bytes from a peer or a server.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [control_frame, data_frames, hello, rendezvous_client, code_parser, path_sanitizer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ inputs.seconds || '600' }} -max_len=65536
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts
