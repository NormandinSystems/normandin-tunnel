name: Repair checksums

# One-off maintenance for a release whose SHA256SUMS.txt was written before
# the upload. GitHub replaces spaces in the names of release files with dots,
# so that list then names files that do not exist under those names.
#
# This rewrites the list with the real names, after checking that every file
# still has exactly the fingerprint the build recorded. It never accepts a
# file whose contents changed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-checksums.yml

permissions:
  contents: write

jobs:
  repair:
    name: Rewrite SHA256SUMS.txt with the real file names
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'v0.1.0' }}
    steps:
      - name: Download the release files
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dl
      - name: Check every fingerprint, then write the list with the real names
        working-directory: dl
        run: |
          mv SHA256SUMS.txt recorded.txt
          : > SHA256SUMS.txt
          while IFS= read -r line; do
            hash="${line%% *}"
            name="${line#*  }"
            real="${name// /.}"
            if [ ! -f "$real" ]; then echo "No file for: $name"; exit 1; fi
            actual=$(sha256sum "$real" | cut -d' ' -f1)
            if [ "$actual" != "$hash" ]; then echo "Fingerprint changed: $real"; exit 1; fi
            echo "$hash  $real" >> SHA256SUMS.txt
          done < recorded.txt
          files=$(ls | grep -v -e '^recorded\.txt$' -e '^SHA256SUMS\.txt$' | wc -l)
          listed=$(wc -l < SHA256SUMS.txt)
          if [ "$files" -ne "$listed" ]; then echo "$files files but $listed listed"; exit 1; fi
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Replace the list on the release
        working-directory: dl
        run: gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
