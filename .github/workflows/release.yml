name: Release

# Tag vX.Y.Z on main to build every desktop artifact and open a draft release.
# The draft is checked by hand before it is published.
#
# Code signing is not configured yet: Windows builds are unsigned, so
# SmartScreen will warn. See docs/RELEASE_CHECKLIST.md for what to add.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            libssl-dev libdbus-1-dev patchelf rpm file
      - name: Install Rust (version pinned in rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Test before building
        run: cargo test --locked
      - name: Build installers
        working-directory: app
        run: |
          npm ci
          npm run tauri build
      - name: Build the command-line app and the rendezvous server
        run: cargo build --release --locked -p tunnel-cli -p tunnel-rendezvous
      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          tag="${GITHUB_REF_NAME}"
          arch="x64"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi out/
            cp target/release/tunnel.exe "out/tunnel-cli-${tag}-windows-${arch}.exe"
            cp target/release/tunnel-rendezvous.exe "out/tunnel-rendezvous-${tag}-windows-${arch}.exe"
          else
            cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage out/
            cp target/release/tunnel "out/tunnel-cli-${tag}-linux-${arch}"
            cp target/release/tunnel-rendezvous "out/tunnel-rendezvous-${tag}-linux-${arch}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}
          if-no-files-found: error
          path: out/*

  draft:
    name: Draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft --verify-tag \
            --title "Normandin Tunnel ${GITHUB_REF_NAME#v}" \
            --notes "Unsigned preview build. Check SHA256SUMS.txt after downloading."
