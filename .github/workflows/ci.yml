name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Engine, command-line app, rendezvous server, integration tests and the
  # hostile-peer harness, on both desktop platforms.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust (version pinned in rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # Two engines with default settings, through the real public relays.
      # It depends on servers this project does not run, so a failure is
      # shown on the step but does not fail the build.
      - name: Pair over the public relay network
        continue-on-error: true
        run: cargo test --locked -p tunnel-tests --test no_server -- --ignored --nocapture default_settings

  # Web UI: types, translations, formatting helpers.
  ui:
    name: UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The desktop app itself, built and packaged on Windows and Linux.
  app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cold Windows build of the app and its installers takes most of an hour.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            libssl-dev libdbus-1-dev patchelf rpm file xvfb imagemagick
      - name: Install Rust (version pinned in rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install UI dependencies and build the UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Lint the app shell
        run: cargo clippy -p normandin-tunnel-app --all-targets --locked -- -D warnings
      # One more full debug build: worth it once, on the faster runner.
      - name: Test the app shell
        if: runner.os == 'Linux'
        run: cargo test -p normandin-tunnel-app --locked
      - name: Build installers
        working-directory: app
        run: npm run tauri build
      - name: Build the command-line app and the rendezvous server
        run: cargo build --release --locked -p tunnel-cli -p tunnel-rendezvous
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: normandin-tunnel-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/tunnel
            target/release/tunnel.exe
            target/release/tunnel-rendezvous
            target/release/tunnel-rendezvous.exe
      # The packaged binary must start, load its interface in the web view,
      # reach the engine from it, and stay up. A screenshot of the running app
      # is kept with the build.
      - name: Smoke test, the app starts (Linux)
        if: runner.os == 'Linux'
        env:
          TUNNEL_DATA_DIR: ${{ runner.temp }}/smoke
          TUNNEL_LOG: info
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" bash -e -c '
            target/release/normandin-tunnel 2> "$RUNNER_TEMP/smoke-stderr.txt" &
            app=$!
            for _ in $(seq 45); do
              grep -q "interface ready" "$RUNNER_TEMP/smoke-stderr.txt" && break
              kill -0 "$app" 2>/dev/null || break
              sleep 2
            done
            sleep 5
            import -window root "$RUNNER_TEMP/smoke-linux.png" || true
            cat "$RUNNER_TEMP/smoke-stderr.txt"
            if ! kill -0 "$app" 2>/dev/null; then
              echo "The app exited on its own"; exit 1
            fi
            kill "$app"
            if ! grep -q "interface ready" "$RUNNER_TEMP/smoke-stderr.txt"; then
              echo "The interface never reached the engine"; exit 1
            fi
          '
      - name: Smoke test, the app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TUNNEL_DATA_DIR: ${{ runner.temp }}\smoke
          TUNNEL_LOG: info
        run: |
          $log = Join-Path $env:RUNNER_TEMP "smoke-stderr.txt"
          $app = Start-Process -FilePath "target\release\normandin-tunnel.exe" -PassThru -RedirectStandardError $log
          function Test-Ready { (Test-Path $log) -and [bool](Select-String -Path $log -Pattern "interface ready" -Quiet) }
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not (Test-Ready) -and -not $app.HasExited) {
            Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 5
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $env:RUNNER_TEMP "smoke-windows.png"))
          } catch {
            Write-Host "No screenshot: $_"
          }
          Write-Host "--- processes"
          Get-Process | Where-Object { $_.ProcessName -match "normandin|webview" } |
            Format-Table Id, ProcessName, MainWindowTitle -AutoSize | Out-String | Write-Host
          Write-Host "--- web view runtime"
          Get-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue |
            Select-Object pv | Out-String | Write-Host
          Write-Host "--- app log"
          if (Test-Path $log) { Get-Content $log }
          Write-Host "--- data folder"
          if (Test-Path $env:TUNNEL_DATA_DIR) { Get-ChildItem $env:TUNNEL_DATA_DIR | Out-String | Write-Host }
          if ($app.HasExited) {
            Write-Error "The app exited on its own with code $($app.ExitCode)"
            exit 1
          }
          Stop-Process -Id $app.Id -Force
          if (-not (Test-Ready)) {
            Write-Error "The interface never reached the engine"
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-test-${{ runner.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/smoke-*.png
            ${{ runner.temp }}/smoke-stderr.txt

  # Supply chain: licences, advisories, sources, leaked secrets.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories licenses bans sources
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --redact --no-banner
