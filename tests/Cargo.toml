[package]
name = "tunnel-tests"
description = "Integration tests and the hostile-peer harness for Normandin Tunnel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "support/lib.rs"

[[test]]
name = "integration"
path = "integration.rs"

[[test]]
name = "evil_peer"
path = "evil_peer.rs"

[[test]]
name = "no_server"
path = "no_server.rs"

[dependencies]
tunnel-core = { workspace = true, features = ["test-utils"] }
tunnel-crypto.workspace = true
tunnel-proto.workspace = true
tunnel-rendezvous.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
base64.workspace = true
serde_json.workspace = true
tempfile.workspace = true
blake3.workspace = true
getrandom.workspace = true
postcard.workspace = true
serde.workspace = true
tracing-subscriber.workspace = true
