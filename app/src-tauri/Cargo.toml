[package]
name = "normandin-tunnel-app"
description = "Normandin Tunnel desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "normandin-tunnel"

[lib]
name = "tunnel_app"
path = "src/lib.rs"

[[bin]]
name = "normandin-tunnel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tunnel-core.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
sys-locale = "0.3"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Developer tools in the web view. Never enabled for release builds.
devtools = ["tauri/devtools"]
